	<script>
		function validateForm() {
			if (isEmpty(document.getElementById('data_3').value.trim())) {
				alert('First name is required!');
				return false;
			}
			if (isEmpty(document.getElementById('data_4').value.trim())) {
				alert('Last name is required!');
				return false;
			}
			if (!validateEmail(document.getElementById('data_5').value.trim())) {
				alert('Email must be a valid email address!');
				return false;
			}
			return true;
		}
		function isEmpty(str) { return (str.length == 0 || !str.trim()); }
		function validateEmail(email) {
			var re = "";
			return isEmpty(email) || re.test(email);
		}
	</script>

	<div class="container">
		<h3>Fill the information!!</h3>
		
		<form method="POST" action="booking.php" name="form" onsubmit="return validateForm()">
			<div class="textbox">
				<input type="text" placeholder="Full Name" name="name" value=""  onkeypress="return /[a-zA-Z]/i.test(event.key)" required>  
			</div>

			<div class="textbox">
				<input type="text" placeholder="Email" name="email" value="" required pattern="[a-z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-z0-9-]+.[a-z]{2,4}" title="Invalid Email">
			</div>

			<div class="textbox">
				<input type="text" placeholder="Phone" name="phone" value="" onkeypress="return /[0-9]/i.test(event.key)" maxlength="10" pattern="([0-9]){10,}" required>
			</div>

			<div class="textbox">
				<input type="text" placeholder="City" name="city" value="" onkeypress="return /[a-zA-Z]/i.test(event.key)" required>
			</div>

			<div class="textbox">
				<input type="text" placeholder="Destination" name="destination" value="" required>
			</div>

			<div class="textbox">
				<input type="number" placeholder="no. of guests" name="guest" value="" required>
			</div>

			<div class="textbox">
				<input type="date" placeholder="check-in date" id="arrivals" name="checkin" value="" required>
			</div>

			<div class="textbox">
				<input type="date" placeholder="check-out date" id="leaving" name="checkout"  value="" required>
			</div>
			<script>
				// JavaScript to validate arrival and leaving dates
				document.getElementById("leaving").addEventListener("change", function() {
					var arrivals = new Date(document.getElementById("arrivals").value);
					var leaving = new Date(this.value);
			
					if (leaving < arrivals) {
						document.getElementById("dateError").textContent = "Leaving date should be greater than or equal to arrival date";
					} else {
						document.getElementById("dateError").textContent = "";
					}
				});
			</script>

			<div class="textbox">
				<input type="text" placeholder="Mode of travel" name="travel" value="" required>
			</div>
			<div class="btn">
				<input name="submit" value="Submit" type="submit">
				<span></span>
			</div>
		</form>
